status-website:
  baseUrl: /etat-des-services
  name: État des services
  introTitle: "État des services Effectivo, Uilia, OttManager et Brice Bechet Consulting"
  # Upptime écrit « 100.00% » : virgule et espace insécable à la française.
  js: "(function(){var r=/(\\d+)\\.(\\d+)%/g;function f(n){var w=document.createTreeWalker(n,4),t;while(t=w.nextNode()){if(r.test(t.data)){r.lastIndex=0;t.data=t.data.replace(r,'$1,$2\\u00a0%');}r.lastIndex=0;}}function go(){f(document.body);new MutationObserver(function(m){m.forEach(function(x){f(x.target.parentNode||x.target);});}).observe(document.body,{subtree:true,childList:true,characterData:true});}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();})();"
  navbar:
    - title: État
      href: /

